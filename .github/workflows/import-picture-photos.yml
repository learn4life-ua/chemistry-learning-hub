name: Import local chemistry photos (one-time)
on:
  push:
    paths:
      - '.github/workflows/import-picture-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-photos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install Pillow==11.3.0
      - name: Download photos once and create local assets
        run: python scripts/import-picture-photos.py
      - name: Commit locally hosted photos and update page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add puzzles/pictures/photos/ puzzles/pictures/pictures.js
          git diff --staged --quiet || git commit -m 'Store chemistry quiz photographs locally'
          git push
